<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Admin Dashboard - fixmyPhone</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <!-- Login Screen -->
    <div
      id="login-screen"
      class="min-h-screen flex items-center justify-center"
    >
      <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
          Admin Login
        </h2>
        <form id="login-form">
          <div class="mb-4">
            <label for="email" class="block text-gray-700 font-semibold mb-2"
              >Email</label
            >
            <input
              type="email"
              id="email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="admin@gofixmyphone.com"
              required
            />
          </div>
          <div class="mb-4">
            <label for="password" class="block text-gray-700 font-semibold mb-2"
              >Password</label
            >
            <input
              type="password"
              id="password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>
          <button
            type="submit"
            id="login-btn"
            class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition-colors"
          >
            Login
          </button>
          <p
            id="login-error"
            class="text-red-500 text-sm mt-2 text-center hidden"
          ></p>
        </form>
      </div>
    </div>

    <!-- Loading State (while checking auth) -->
    <div
      id="auth-loading"
      class="min-h-screen flex items-center justify-center hidden"
    >
      <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content" class="hidden">
      <header class="bg-white shadow-md">
        <div
          class="container mx-auto px-6 py-4 flex justify-between items-center"
        >
          <h1 class="text-2xl font-bold text-blue-600">fixmyPhone Admin</h1>
          <div class="flex items-center space-x-4">
            <span id="user-email" class="text-sm text-gray-500 hidden md:inline"></span>
            <button
              id="logout-button"
              class="text-sm text-gray-600 hover:text-blue-600"
            >
              Logout
            </button>
          </div>
        </div>
      </header>
      <main class="container mx-auto px-6 py-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Quote Requests</h2>
        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="p-4 font-semibold text-sm">Date</th>
                <th class="p-4 font-semibold text-sm">Customer</th>
                <th class="p-4 font-semibold text-sm">Contact</th>
                <th class="p-4 font-semibold text-sm">Details</th>
                <th class="p-4 font-semibold text-sm">Status</th>
              </tr>
            </thead>
            <tbody id="quotes-table-body">
              <!-- Rows will be injected here -->
            </tbody>
          </table>
          <div id="loading-state" class="text-center p-8">
            <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
            <p class="mt-2 text-gray-500">Loading requests...</p>
          </div>
          <div id="empty-state" class="text-center p-8 hidden">
            <p class="text-gray-500">No quote requests found.</p>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        query,
        onSnapshot,
        doc,
        updateDoc,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAPwUjYPD5CzGIfT_6KqkpdLKnUNURSIs8",
        authDomain: "fixmyphone-website-889b5.firebaseapp.com",
        projectId: "fixmyphone-website-889b5",
        storageBucket: "fixmyphone-website-889b5.appspot.com",
        messagingSenderId: "619306240303",
        appId: "1:619306240303:web:f1e2445eec7bba1a09b9da",
        measurementId: "G-7HZ9D236TS",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const appId = "fixmyphone-website-889b5";

      // DOM Elements
      const loginScreen = document.getElementById("login-screen");
      const authLoading = document.getElementById("auth-loading");
      const dashboardContent = document.getElementById("dashboard-content");
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const loginBtn = document.getElementById("login-btn");
      const logoutButton = document.getElementById("logout-button");
      const userEmailEl = document.getElementById("user-email");
      const quotesTableBody = document.getElementById("quotes-table-body");
      const loadingState = document.getElementById("loading-state");
      const emptyState = document.getElementById("empty-state");

      // Show loading state while Firebase checks auth
      loginScreen.classList.add("hidden");
      authLoading.classList.remove("hidden");

      // Listen for auth state changes
      onAuthStateChanged(auth, (user) => {
        authLoading.classList.add("hidden");

        if (user) {
          // User is signed in — show dashboard
          loginScreen.classList.add("hidden");
          dashboardContent.classList.remove("hidden");
          userEmailEl.textContent = user.email;
          fetchQuotes();
        } else {
          // User is signed out — show login
          dashboardContent.classList.add("hidden");
          loginScreen.classList.remove("hidden");
        }
      });

      // Login form handler
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.classList.add("hidden");
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          // onAuthStateChanged will handle the redirect
        } catch (error) {
          let message = "Login failed. Please try again.";
          if (
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/invalid-credential"
          ) {
            message = "Invalid email or password.";
          } else if (error.code === "auth/too-many-requests") {
            message = "Too many attempts. Please try again later.";
          } else if (error.code === "auth/invalid-email") {
            message = "Please enter a valid email address.";
          }
          loginError.textContent = message;
          loginError.classList.remove("hidden");
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }
      });

      // Logout handler
      logoutButton.addEventListener("click", () => {
        signOut(auth);
      });

      // Fetch and display quotes
      function fetchQuotes() {
        if (!db) {
          loadingState.innerHTML =
            '<p class="text-red-500">Database connection failed.</p>';
          return;
        }

        const quotesCollectionRef = collection(
          db,
          "artifacts",
          appId,
          "public",
          "data",
          "quoteRequests"
        );
        const q = query(quotesCollectionRef, orderBy("submittedAt", "desc"));

        onSnapshot(
          q,
          (snapshot) => {
            loadingState.classList.add("hidden");
            if (snapshot.empty) {
              emptyState.classList.remove("hidden");
              quotesTableBody.innerHTML = "";
            } else {
              emptyState.classList.add("hidden");
              quotesTableBody.innerHTML = "";
              snapshot.forEach((docSnap) => {
                const quote = docSnap.data();
                const quoteId = docSnap.id;
                const row = document.createElement("tr");
                row.className = "border-b border-gray-200";

                const submittedAt = quote.submittedAt
                  ? quote.submittedAt.toDate().toLocaleString("en-IN")
                  : "N/A";

                let detailsHtml = "";
                if (quote.message) {
                  detailsHtml = `
                    <p class="font-semibold text-gray-700">Contact Message:</p>
                    <p class="text-gray-600 italic break-words max-w-xs">"${quote.message}"</p>
                  `;
                } else if (quote.device && (quote.services || quote.issue)) {
                  let servicesText = "";
                  if (quote.services) {
                    if (Array.isArray(quote.services)) {
                      servicesText = quote.services.join(", ");
                    } else {
                      servicesText = quote.services;
                    }
                  } else if (quote.issue) {
                    servicesText = quote.issue;
                  }
                  detailsHtml = `
                    <p class="font-semibold">${quote.device || "N/A"}</p>
                    <p class="text-gray-600 break-words max-w-xs">${servicesText || "No services listed"}</p>
                  `;
                } else {
                  detailsHtml =
                    '<p class="text-gray-500">No details provided.</p>';
                }

                row.innerHTML = `
                  <td class="p-4 text-sm">${submittedAt}</td>
                  <td class="p-4 text-sm font-semibold">${quote.name || "N/A"}</td>
                  <td class="p-4 text-sm">
                    <p>${quote.phone || ""}</p>
                    <p class="text-gray-500">${quote.email || ""}</p>
                  </td>
                  <td class="p-4 text-sm">${detailsHtml}</td>
                  <td class="p-4 text-sm">
                    <select data-id="${quoteId}" class="status-dropdown rounded-lg border-gray-300 text-sm">
                      <option value="New" ${quote.status === "New" ? "selected" : ""}>New</option>
                      <option value="Contacted" ${quote.status === "Contacted" ? "selected" : ""}>Contacted</option>
                      <option value="In Progress" ${quote.status === "In Progress" ? "selected" : ""}>In Progress</option>
                      <option value="Completed" ${quote.status === "Completed" ? "selected" : ""}>Completed</option>
                      <option value="Cancelled" ${quote.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
                    </select>
                  </td>
                `;
                quotesTableBody.appendChild(row);
              });
            }
          },
          (error) => {
            console.error("Error fetching quotes:", error);
            loadingState.innerHTML =
              '<p class="text-red-500">Error fetching data. Check console.</p>';
          }
        );
      }

      // Status change handler
      quotesTableBody.addEventListener("change", (e) => {
        if (e.target.classList.contains("status-dropdown")) {
          const docId = e.target.dataset.id;
          const newStatus = e.target.value;
          const docRef = doc(
            db,
            "artifacts",
            appId,
            "public",
            "data",
            "quoteRequests",
            docId
          );
          updateDoc(docRef, { status: newStatus }).catch((err) =>
            console.error("Error updating status:", err)
          );
        }
      });
    </script>
  </body>
</html>
