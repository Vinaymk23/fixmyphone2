# Netlify configuration for gofixmyphone.com
#
# Deliberately contains NO [build] section: the site is plain static files
# served from the repository root, and the publish directory is already set
# in the Netlify UI. Adding one here could point Netlify at the wrong folder.

# ---------------------------------------------------------------------------
# Security headers, applied to every response.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Stop other sites from embedding these pages in an iframe (clickjacking).
    X-Frame-Options = "SAMEORIGIN"

    # Stop browsers guessing a file's type against its declared Content-Type.
    X-Content-Type-Options = "nosniff"

    # Send the full URL only to our own pages; just the origin to other sites.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # This site needs none of these device APIs, so switch them off.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# ---------------------------------------------------------------------------
# Long-lived caching for assets that effectively never change.
# styles.css is deliberately NOT cached this way: it has no content hash in
# its filename, so a long cache would leave visitors on a stale stylesheet
# after a deploy. Netlify's default (revalidate with ETag) is correct for it.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
